conky.config = {

    lua_load = '/home/flolit/.config/conky/scripts/cpu_graph.lua',
    --------------------------------------------------
    -- Telemetry only. The audio spectrum lives in its own
    -- Conky instance (conky-spectrum.conf) so it can run at
    -- 60 fps without dragging these readings with it.
    --------------------------------------------------
    update_interval = 1.0,
    total_run_times = 0,

    double_buffer = true,
    no_buffers = true,

    cpu_avg_samples = 2,
    net_avg_samples = 2,

    --------------------------------------------------
    -- WINDOW
    --------------------------------------------------
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    --------------------------------------------------
    -- LEFT FULL-HD MONITOR
    -- Change xinerama_head if your monitor numbering differs.
    --------------------------------------------------
    xinerama_head = 1,
    alignment = 'top_left',

    gap_x = 20,
    gap_y = 18,

    minimum_width = 500,
    maximum_width = 500,

    --------------------------------------------------
    -- FONT
    --------------------------------------------------
    use_xft = true,
    xftalpha = 1,

    font = 'Jersey 15:size=12',
    default_color = 'FFFFFF',

    uppercase = false,
    temperature_unit = 'celsius',
};

conky.text = [[
${font Jersey 15:size=42}${time %H:%M}${font}
${font Jersey 15:size=15}${time %A %d %B %Y}${font}

${voffset 8}${font Jersey 15:size=19}WEATHER${font}
${hr 1}
${voffset 2}${font Jersey 15:size=14}${execi 900 curl -s --max-time 5 'https://wttr.in/?format=%C'}${font}
${font Jersey 15:size=13}POSITION${alignr}${execi 900 curl -s --max-time 5 'https://wttr.in/?format=%l'}${font}
${font Jersey 15:size=13}TEMP ${execi 900 curl -s --max-time 5 'https://wttr.in/?format=%t'}${alignr}HUM ${execi 900 curl -s --max-time 5 'https://wttr.in/?format=%h'}${font}

${voffset 10}${font Jersey 15:size=20}SYSTEM TELEMETRY${font}
${hr 1}

${voffset 5}${font Jersey 15:size=18}CPU${font}${alignr}${font Jersey 15:size=16}${execi 2 sensors coretemp-isa-0000 | awk '/Package id 0:/ {print $4}'}${font}
${font Jersey 15:size=12}${execi 3600 ~/.config/conky/scripts/cpu_name.sh}  /  MAX ${execi 3600 ~/.config/conky/scripts/cpu_max_ghz.sh} GHZ${font}
${voffset 1}${cpubar 7,480}
${font Jersey 15:size=13}LOAD ${cpu}%${alignr}MAX CORE CLOCK ${execi 1 ~/.config/conky/scripts/cpu_clock.sh} GHz${font}
${font Jersey 15:size=13}PKG POWER${alignr}${execi 2 ~/.config/conky/scripts/cpu_power.sh}${font}
${lua_graph cpu_clock_avg_pct 52,480 FFFFFF FFFFFF 100}
${font Jersey 15:size=11}0 %${alignr}100 %${font}

${voffset 6}${font Jersey 15:size=18}GPU${font}${alignr}${font Jersey 15:size=16}${execi 2 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits}°C${font}
${font Jersey 15:size=12}${execi 3600 ~/.config/conky/scripts/gpu_name.sh}${font}
${voffset 1}${execibar 2 7,480 ~/.config/conky/scripts/gpu_util.sh}
${font Jersey 15:size=13}LOAD ${execi 2 ~/.config/conky/scripts/gpu_util.sh}%${alignr}POWER ${execi 2 nvidia-smi --query-gpu=power.draw --format=csv,noheader,nounits} W${font}
${font Jersey 15:size=13}VRAM${alignr}${execi 2 nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits} / ${execi 10 nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits} MiB${font}

${voffset 6}${font Jersey 15:size=18}MEMORY${font}${alignr}${font Jersey 15:size=16}${memperc}%${font}
${font Jersey 15:size=12}SYSTEM RAM  /  ${memmax}${font}
${voffset 1}${membar 7,480}
${font Jersey 15:size=13}USED ${mem}${alignr}FREE ${memeasyfree}${font}

${voffset 6}${font Jersey 15:size=18}SYSTEM NVME${font}${alignr}${font Jersey 15:size=16}${execi 5 ~/.config/conky/scripts/ssd_temp.sh}${font}
${font Jersey 15:size=12}${execi 3600 ~/.config/conky/scripts/ssd_name.sh}${font}
${voffset 1}${fs_bar 7,480 /}
${font Jersey 15:size=13}USED ${fs_used /}${alignr}TOTAL ${fs_size /}${font}
]];
