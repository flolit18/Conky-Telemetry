--------------------------------------------------
-- Audio spectrum, second Conky instance.
--
-- Runs at 60 fps on its own, so the telemetry HUD
-- (conky.conf) can stay at 1 s without tearing the
-- bars apart. Anchored to the bottom of the screen,
-- directly under the HUD.
--------------------------------------------------

conky.config = {
    -- 1 / 60 s. CAVA must run at framerate = 60 to match.
    update_interval = 0.0167,
    total_run_times = 0,

    double_buffer = true,
    no_buffers = true,

    --------------------------------------------------
    -- SPECTRUM ANALYSER
    --------------------------------------------------
    lua_load = '~/.config/conky/spectrum/spectrum.lua',
    lua_draw_hook_post = 'draw_spectrum',

    --------------------------------------------------
    -- WINDOW
    --------------------------------------------------
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    --------------------------------------------------
    -- LEFT FULL-HD MONITOR
    --
    -- Same head and left margin as the HUD, but anchored
    -- to the bottom. Raise gap_y if the block overlaps the
    -- NVME section above it.
    --------------------------------------------------
    xinerama_head = 1,
    alignment = 'bottom_left',

    gap_x = 20,
    gap_y = 18,

    minimum_width = 500,
    maximum_width = 500,

    --------------------------------------------------
    -- FONT
    --------------------------------------------------
    use_xft = true,
    xftalpha = 1,

    font = 'Jersey 15:size=12',
    default_color = 'FFFFFF',

    uppercase = false,
};

--------------------------------------------------
-- The voffset below is the empty band the Lua hook
-- draws into. To make the bars taller, raise it and
-- GRAPH_HEIGHT in spectrum.lua by the SAME amount.
--
-- Everything under the band is measured by
-- BOTTOM_OFFSET in spectrum.lua: change these lines
-- and that constant moves with them. The track line
-- sits ABOVE the band, so it does not affect it.
--
-- That line uses DejaVu Sans and not Jersey 15 on
-- purpose: Jersey is a pixel font with no accented
-- or non-Latin glyphs, and track titles have both.
--------------------------------------------------

conky.text = [[
${font Jersey 15:size=18}AUDIO SPECTRUM${font}
${hr 1}
${voffset 2}${font DejaVu Sans:size=9}${execi 2 ~/.config/conky/spectrum/now_playing.sh}${font}
${voffset 155}
${font Jersey 15:size=11}30 HZ${alignr}20 KHZ${font}
${voffset -10}${hr 1}
]];
