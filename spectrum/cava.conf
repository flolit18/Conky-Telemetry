[general]
# MR4 + T5s subwoof -> 30 Hz --> 20 kHz
# Below ~30 Hz there is almost never any content, so the first
# bars would sit at zero permanently.
bars = 32

# Must match the update_interval of conky-spectrum.conf (0.0167 s),
# otherwise Conky draws the same frame twice.
framerate = 60
lower_cutoff_freq = 30
higher_cutoff_freq = 20000

[input]
method = pulse
source = auto

[output]
method = raw

channels = mono
mono_option = average

raw_target = /tmp/conky-cava.fifo

data_format = ascii
ascii_max_range = 100

bar_delimiter = 59
frame_delimiter = 10